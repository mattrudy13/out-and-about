name: Update events

on:
  schedule:
    # 6 AM, 10 AM, 2 PM and 6 PM Eastern in daylight time (an hour earlier in winter). Events are planned
    # weeks ahead, so a few runs a day is plenty; GitHub skips some scheduled runs, hence four, not one.
    - cron: "15 10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the branch tip, not the commit that triggered the run: a run that waited in the
      # concurrency queue would otherwise build on stale data and conflict on push.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # A failed source keeps its last listings inside the script, so this step only fails on a crash.
      - name: Events
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: node scripts/events.mjs
      - name: Commit if changed
        run: |
          # `updated` changes on every run, so ignore it when deciding whether anything changed.
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const f = "data/events.json";
            let old = "";
            try { old = execSync(`git show HEAD:${f}`).toString(); } catch {}
            const strip = (s) => s.replace(/"updated":\s*"[^"]*",?/g, "");
            const real = strip(old) !== strip(fs.readFileSync(f, "utf8"));
            fs.writeFileSync(process.env.GITHUB_ENV, `DATA_CHANGED=${real}\n`, { flag: "a" });
          '
      - name: Push
        if: env.DATA_CHANGED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "chore(data): refresh events $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q
          git push
      # Fail the run (GitHub emails) when a source has been down for 48 h, after pushing whatever did work.
      # Virginia MOCA and Virginia Symphony fail about 1 run in 4 (an HTML page instead of JSON), and the
      # next run has always worked; a failed source keeps its listings, so a short outage changes nothing
      # on the page. `checked` is a source's last success. Rudy's choice (2026-11-02): alert at 48 h.
      # The Mac-only sources (The Z, Little Theatre) aren't fetched here, so they only count once Rudy's
      # Mac hasn't refreshed them for 14 days: that means the weekly job has stopped.
      - name: Report failed sources
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("data/events.json", "utf8")).sources;
            const DAY = 86400000;
            const since = (v) => (v.checked ? Date.now() - new Date(v.checked) : Infinity);
            const down = (v) => !v.ok && since(v) > 2 * DAY;
            const bad = Object.entries(s).filter(([, v]) => (v.macOnly ? since(v) > 14 * DAY : down(v)));
            const blips = Object.entries(s).filter(([, v]) => !v.macOnly && !v.ok && !down(v));
            if (blips.length) console.log(`Failed this run, under 48 h: ${blips.map(([n, v]) => `${n} (${v.error})`).join("; ")}`);
            if (bad.length) {
              console.log(bad.map(([n, v]) => v.macOnly ? `${n}: not refreshed from the Mac since ${v.checked}` : `${n}: down since ${v.checked ?? "it was added"}: ${v.error}`).join("\n"));
              process.exit(1);
            }
          '
